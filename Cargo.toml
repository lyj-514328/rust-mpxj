[package]
name = "mpxj-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust port of the MPXJ reader: parse Microsoft Project MPP, MPX and MSPDI (XML) files into a unified ProjectFile model."
license = "LGPL-2.1-or-later"
repository = "https://github.com/lyj-514328/rust-mpxj"
readme = "README.md"
keywords = ["microsoft-project", "mpp", "mpx", "mspdi", "parser"]
categories = ["parser-implementations"]
exclude = [
    "mpxj",
    "tests",
    "examples",
    "tools",
    "_tmp_*",
    "TECH_DEBT.md",
    "AGENTS.md",
    ".gitmodules",
]

[lib]
name = "mpxj"
path = "src/lib.rs"

[dependencies]
byteorder = "1.5.0"
cfb = "0.15.0"
chrono = "0.4.45"
encoding_rs = "0.8.41"
roxmltree = "0.21.1"
thiserror = "2.0.20"
uuid = "1.26.1"
